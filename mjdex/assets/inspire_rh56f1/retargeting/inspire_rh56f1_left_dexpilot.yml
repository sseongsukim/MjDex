# DexPilot retargeting config for Inspire RH56F1 Left Hand
# URDF path is relative to the urdf_dir passed to RetargetingConfig.set_default_urdf_dir()
# (set to mjdex/assets/ in visionpro_teleop.py)
#
# target_joint_names order intentionally matches the MuJoCo left_hand.xml actuator order:
#   [thumb_1, thumb_2, index, middle, ring, little]
# so the dex-retargeting output maps 1-to-1 onto gripper_actuator_ids with no reordering.
retargeting:
  type: DexPilot
  urdf_path: inspire_rh56f1/assets_left/urdf/inspire_rh56f1_left.urdf

  target_joint_names:
    - left_thumb_1_joint
    - left_thumb_2_joint
    - left_index_1_joint
    - left_middle_1_joint
    - left_ring_1_joint
    - left_little_1_joint

  wrist_link_name: base_link

  finger_tip_link_names: [thumb_tip, index_tip, middle_tip, ring_tip, little_tip]

  scaling_factor: 1.15

  low_pass_alpha: 1.0
